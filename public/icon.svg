<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#fff5e1"/>
      <stop offset="100%" stop-color="#ffd6e0"/>
    </radialGradient>
    <radialGradient id="petal" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#ff8fa9"/>
    </radialGradient>
    <filter id="wc">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- bush -->
  <g filter="url(#wc)">
    <ellipse cx="256" cy="340" rx="200" ry="120" fill="#6dbf6b"/>
    <circle cx="170" cy="300" r="90" fill="#6dbf6b"/>
    <circle cx="342" cy="300" r="90" fill="#6dbf6b"/>
    <circle cx="256" cy="240" r="100" fill="#6dbf6b"/>
    <circle cx="220" cy="280" r="80" fill="#6dbf6b"/>
    <circle cx="292" cy="280" r="80" fill="#6dbf6b"/>
  </g>
  <!-- flowers -->
  <g>
    <g transform="translate(256 220)">
      <ellipse cx="0" cy="-22" rx="14" ry="18" fill="url(#petal)"/>
      <ellipse cx="20" cy="-7" rx="14" ry="18" fill="url(#petal)"/>
      <ellipse cx="13" cy="18" rx="14" ry="18" fill="url(#petal)"/>
      <ellipse cx="-13" cy="18" rx="14" ry="18" fill="url(#petal)"/>
      <ellipse cx="-20" cy="-7" rx="14" ry="18" fill="url(#petal)"/>
      <circle r="10" fill="#ffd966"/>
    </g>
    <g transform="translate(180 270)">
      <ellipse cx="0" cy="-14" rx="10" ry="13" fill="#fff5e1"/>
      <ellipse cx="13" cy="-4" rx="10" ry="13" fill="#fff5e1"/>
      <ellipse cx="8" cy="12" rx="10" ry="13" fill="#fff5e1"/>
      <ellipse cx="-8" cy="12" rx="10" ry="13" fill="#fff5e1"/>
      <ellipse cx="-13" cy="-4" rx="10" ry="13" fill="#fff5e1"/>
      <circle r="7" fill="#ffd966"/>
    </g>
    <g transform="translate(330 270)">
      <ellipse cx="0" cy="-14" rx="10" ry="13" fill="#c89bff"/>
      <ellipse cx="13" cy="-4" rx="10" ry="13" fill="#c89bff"/>
      <ellipse cx="8" cy="12" rx="10" ry="13" fill="#c89bff"/>
      <ellipse cx="-8" cy="12" rx="10" ry="13" fill="#c89bff"/>
      <ellipse cx="-13" cy="-4" rx="10" ry="13" fill="#c89bff"/>
      <circle r="7" fill="#fff099"/>
    </g>
  </g>
</svg>
