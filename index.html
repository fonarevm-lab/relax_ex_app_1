<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd6e0">
<title>Волшебный сад</title>
<style>
  :root{
    --sky-1:#ffd6e0;
    --sky-2:#ffe9d6;
    --sky-3:#d6f0e8;
    --grass:#b8e0b3;
    --grass-d:#8fc88a;
    --bush:#6dbf6b;
    --bush-d:#4a9a4a;
    --bush-l:#a8e0a0;
    --pink:#ff8fa9;
    --yellow:#ffd966;
    --purple:#c89bff;
    --cream:#fff5e1;
    --text:#5a3d4f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Comic Sans MS",system-ui,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 45%,var(--sky-3) 100%);user-select:none;-webkit-user-select:none;}
  #app{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;}
  /* === Sun === */
  .sun{position:absolute;top:7%;right:8%;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff5b3 0%,#ffd966 55%,#ffb84d 100%);box-shadow:0 0 50px rgba(255,220,130,.65),0 0 80px rgba(255,200,120,.35);animation:sunPulse 4s ease-in-out infinite;z-index:1;}
  @keyframes sunPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  /* === Clouds === */
  .cloud{position:absolute;background:rgba(255,255,255,.85);border-radius:50%;filter:blur(1.8px);animation:drift linear infinite;z-index:1;box-shadow:inset 0 -4px 8px rgba(180,200,220,.25);}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%;}
  .cloud::before{width:80%;height:160%;top:-65%;left:8%;}
  .cloud::after{width:70%;height:140%;top:-50%;right:5%;}
  .cloud.c1{animation-duration:75s;}
  .cloud.c2{animation-duration:110s;opacity:.7;animation-delay:-40s;}
  .cloud.c3{animation-duration:90s;opacity:.6;animation-delay:-65s;}
  .cloud.c4{animation-duration:130s;opacity:.5;animation-delay:-20s;}
  @keyframes drift{from{transform:translateX(-260px);}to{transform:translateX(calc(100vw + 260px));}}
  /* === Sky overlays === */
  .sky-layer{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(255,220,230,.6) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(255,230,200,.5) 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(200,230,255,.35) 0%,transparent 60%);z-index:0;}
  /* === Background scenery (house on horizon + tree) === */
  .house-wrap{position:absolute;bottom:30%;left:50%;transform:translateX(-50%);width:70%;max-width:300px;z-index:2;filter:drop-shadow(0 6px 10px rgba(80,60,80,.16));opacity:.92;}
  .house-svg{display:block;width:100%;height:auto;}
  .tree-wrap{position:absolute;bottom:3%;right:2%;width:30%;max-width:130px;z-index:2.5;filter:drop-shadow(0 4px 6px rgba(80,60,80,.12));transform-origin:50% 100%;animation:treeSway 6s ease-in-out infinite;}
  .tree-svg{display:block;width:100%;height:auto;}
  @keyframes treeSway{0%,100%{transform:rotate(-1deg);}50%{transform:rotate(1.2deg);}}
  /* === Ground === */
  .ground{position:absolute;bottom:0;left:0;right:0;height:32%;background:linear-gradient(180deg,var(--grass) 0%,var(--grass-d) 100%);border-top-left-radius:50% 25%;border-top-right-radius:50% 25%;box-shadow:inset 0 4px 0 rgba(255,255,255,.2);z-index:2;}
  .ground::before{content:"";position:absolute;top:-6px;left:0;right:0;height:14px;background:radial-gradient(ellipse at 10% 50%,var(--grass) 0%,transparent 50%),radial-gradient(ellipse at 30% 50%,var(--grass-l) 0%,transparent 60%),radial-gradient(ellipse at 55% 50%,var(--grass) 0%,transparent 50%),radial-gradient(ellipse at 80% 50%,var(--grass-l) 0%,transparent 60%),radial-gradient(ellipse at 95% 50%,var(--grass) 0%,transparent 50%);background-size:60px 14px;background-repeat:repeat-x;}
  /* === Bush === */
  .bush-wrap{position:absolute;bottom:24%;left:50%;transform:translateX(-50%) scale(0.4);transform-origin:bottom center;transition:transform 2.2s cubic-bezier(.34,1.56,.64,1);z-index:3;filter:drop-shadow(0 10px 14px rgba(80,60,80,.18));}
  .bush-svg{display:block;}
  /* === Flowers === */
  .flower{opacity:0;transform:scale(0);transform-origin:center;transition:all .8s cubic-bezier(.34,1.56,.64,1);}
  .flower.bloom{opacity:1;transform:scale(1);}
  /* === Kittens === */
  .kittens-row{position:absolute;bottom:6%;left:0;right:0;height:30%;z-index:4;pointer-events:none;}
  .kitten{position:absolute;bottom:0;opacity:0;transform:translateY(40px) scale(.2);transition:transform 1.4s cubic-bezier(.34,1.56,.64,1),opacity 1.2s;cursor:pointer;pointer-events:auto;will-change:transform;}
  .kitten.in{opacity:1;transform:translateY(0) scale(.75);}
  .kitten.adult.in{transform:translateY(0) scale(1);}
  .kitten.grow{transition:transform 1.8s cubic-bezier(.34,1.56,.64,1);}
  .kitten:hover,.kitten:active{filter:drop-shadow(0 0 12px rgba(255,220,120,.7)) brightness(1.05);}
  .kitten .tail{transform-origin:30% 100%;}
  /* === Confetti canvas === */
  #confetti{position:absolute;inset:0;pointer-events:none;z-index:9;}
  /* === Mute button === */
  .icon-btn{position:absolute;border:none;background:rgba(255,255,255,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;z-index:20;box-shadow:0 4px 14px rgba(120,80,100,.18);transition:transform .15s,opacity .3s;}
  .icon-btn:active{transform:scale(.9);}
  .mute-btn{top:max(16px,env(safe-area-inset-top));right:16px;width:46px;height:46px;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center;}
  /* === Status panel === */
  .status{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;background:rgba(255,255,255,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px;padding:10px 14px;font-size:13px;z-index:15;box-shadow:0 4px 14px rgba(120,80,100,.12);line-height:1.5;}
  .status p{margin:0;display:flex;align-items:center;gap:6px;}
  .status b{color:var(--bush-d);font-weight:700;margin-left:auto;}
  /* === Reset button === */
  .reset-btn{bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:7px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:11.5px;color:var(--text);opacity:.5;letter-spacing:.2px;}
  .reset-btn:hover,.reset-btn:active{opacity:.95;}
  /* === Title === */
  .title{position:absolute;top:max(80px,calc(env(safe-area-inset-top) + 70px));left:50%;transform:translateX(-50%);font-size:18px;font-weight:700;color:var(--text);text-shadow:0 1px 0 rgba(255,255,255,.6);z-index:12;text-align:center;letter-spacing:.3px;opacity:0;transition:opacity .8s;}
  .title.in{opacity:1;}
  /* === Sparkles === */
  .sparkle{position:absolute;pointer-events:none;animation:sparkle 2.2s ease-in-out infinite;z-index:8;}
  @keyframes sparkle{0%,100%{opacity:0;transform:scale(.4) rotate(0);}50%{opacity:1;transform:scale(1) rotate(180deg);}}
  /* === Celebration text === */
  .celebrate{position:absolute;top:28%;left:50%;font-size:22px;font-weight:700;color:var(--text);text-shadow:0 2px 8px rgba(255,255,255,.85);z-index:12;pointer-events:none;text-align:center;white-space:nowrap;opacity:0;animation:pop 2.8s ease-out forwards;}
  @keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(20px) scale(.5);}15%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.15);}75%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}100%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(1);}}
  /* === Idle kitten animations === */
  @keyframes wag{0%,100%{transform:rotate(0);}50%{transform:rotate(-6deg);}}
  @keyframes breathe{0%,100%{transform:scaleY(1);}50%{transform:scaleY(.94);}}
  @keyframes wash{0%,100%{transform:rotate(0);}25%{transform:rotate(-10deg) translateX(-3px);}75%{transform:rotate(10deg) translateX(3px);}}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-18px);}}
  @keyframes prowl{0%,100%{transform:translateX(0);}50%{transform:translateX(24px);}}
  @keyframes yawn{0%,80%,100%{transform:scaleY(1);}88%{transform:scaleY(.9);}}
  @keyframes stretch{0%,100%{transform:scaleY(.92) scaleX(1.05);}50%{transform:scaleY(1.08) scaleX(.96);}}
  @keyframes lick{0%,100%{transform:rotate(0) translateY(0);}30%{transform:rotate(-7deg) translateX(-2px) translateY(-2px);}60%{transform:rotate(-3deg) translateX(-1px) translateY(-3px);}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1);}96%{transform:scaleY(.1);}}
  .anim-wag g{animation:wag 2s ease-in-out infinite;transform-origin:50% 100%;}
  .anim-breathe g{animation:breathe 3s ease-in-out infinite;transform-origin:50% 100%;}
  .anim-wash g{animation:wash 2.4s ease-in-out infinite;transform-origin:50% 100%;}
  .anim-bounce g{animation:bounce 1.4s ease-in-out infinite;}
  .anim-prowl g{animation:prowl 4.5s ease-in-out infinite;}
  .anim-yawn g{animation:yawn 4s ease-in-out infinite;transform-origin:50% 100%;}
  .anim-stretch g{animation:stretch 3.5s ease-in-out infinite;transform-origin:50% 100%;}
  .anim-lick g{animation:lick 2.8s ease-in-out infinite;transform-origin:50% 100%;}
  .eye{transform-origin:center;animation:blink 5s ease-in-out infinite;}
  .eye.r{animation-delay:.15s;}
</style>
</head>
<body>
<div id="app">
  <div class="sky-layer"></div>
  <div class="sun"></div>
  <div class="cloud c1" style="top:14%;width:140px;height:44px;animation-delay:0s;"></div>
  <div class="cloud c2" style="top:9%;width:100px;height:34px;animation-delay:-45s;"></div>
  <div class="cloud c3" style="top:22%;width:80px;height:28px;animation-delay:-80s;"></div>
  <div class="ground"></div>

  <div class="house-wrap">
    <svg class="house-svg" viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="logGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e8c599"/>
          <stop offset="100%" stop-color="#c89968"/>
        </linearGradient>
        <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#c97050"/>
          <stop offset="100%" stop-color="#8a4530"/>
        </linearGradient>
        <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a4a6a"/>
          <stop offset="100%" stop-color="#1a2a4a"/>
        </linearGradient>
        <radialGradient id="windowGlow" cx="50%" cy="60%">
          <stop offset="0%" stop-color="#fff5b3" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#fff5b3" stop-opacity="0"/>
        </radialGradient>
        <filter id="wc-bg" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="9"/>
          <feDisplacementMap in="SourceGraphic" scale="3"/>
          <feGaussianBlur stdDeviation="0.4"/>
        </filter>
      </defs>
      <g filter="url(#wc-bg)">
        <!-- soft ground shadow under house -->
        <ellipse cx="130" cy="210" rx="120" ry="4" fill="rgba(80,60,80,.22)"/>

        <!-- roof (pitched) -->
        <polygon points="20,108 130,40 240,108" fill="url(#roofGrad)"/>
        <line x1="20" y1="108" x2="240" y2="108" stroke="#6a3520" stroke-width="2.5" opacity=".55"/>
        <!-- roof shingle hints -->
        <path d="M 40 102 L 70 80 M 60 110 L 100 80 M 100 108 L 140 78 M 140 110 L 180 80 M 180 108 L 220 84" stroke="#7a3a25" stroke-width="1" fill="none" opacity=".4"/>

        <!-- walls (log cabin) -->
        <rect x="30" y="105" width="200" height="100" fill="url(#logGrad)"/>
        <!-- horizontal log lines -->
        <g stroke="#8a5a3a" stroke-width="1.2" opacity=".5">
          <line x1="30" y1="120" x2="230" y2="120"/>
          <line x1="30" y1="135" x2="230" y2="135"/>
          <line x1="30" y1="150" x2="230" y2="150"/>
          <line x1="30" y1="165" x2="230" y2="165"/>
          <line x1="30" y1="180" x2="230" y2="180"/>
          <line x1="30" y1="195" x2="230" y2="195"/>
        </g>
        <!-- log end caps on left/right walls -->
        <g fill="#a8754a" opacity=".55">
          <circle cx="36" cy="127" r="2.5"/>
          <circle cx="36" cy="142" r="2.5"/>
          <circle cx="36" cy="157" r="2.5"/>
          <circle cx="36" cy="172" r="2.5"/>
          <circle cx="36" cy="187" r="2.5"/>
          <circle cx="224" cy="127" r="2.5"/>
          <circle cx="224" cy="142" r="2.5"/>
          <circle cx="224" cy="157" r="2.5"/>
          <circle cx="224" cy="172" r="2.5"/>
          <circle cx="224" cy="187" r="2.5"/>
        </g>
        <!-- corner post -->
        <rect x="28" y="100" width="6" height="108" fill="#9a6a4a" opacity=".7"/>
        <rect x="226" y="100" width="6" height="108" fill="#9a6a4a" opacity=".7"/>

        <!-- chimney -->
        <rect x="180" y="55" width="16" height="42" fill="#8a4a30"/>
        <rect x="177" y="52" width="22" height="6" fill="#5a2a18"/>

        <!-- big open window (only window, no door) -->
        <!-- window frame (outer) -->
        <rect x="86" y="120" width="88" height="62" fill="#7a4a2a"/>
        <!-- window opening (dark inside) -->
        <rect x="92" y="126" width="76" height="50" fill="url(#windowGrad)"/>
        <!-- warm glow from inside -->
        <ellipse cx="130" cy="160" rx="34" ry="14" fill="url(#windowGlow)"/>
        <!-- cross frame -->
        <line x1="130" y1="126" x2="130" y2="176" stroke="#a88060" stroke-width="3"/>
        <line x1="92" y1="151" x2="168" y2="151" stroke="#a88060" stroke-width="3"/>
        <!-- window sill -->
        <rect x="80" y="180" width="100" height="6" fill="#6a3a20"/>
        <!-- tiny curtains hint -->
        <path d="M 92 126 Q 100 132 92 138 Z" fill="#ffb3c6" opacity=".55"/>
        <path d="M 168 126 Q 160 132 168 138 Z" fill="#ffb3c6" opacity=".55"/>

        <!-- little warm light dots suggesting lamp inside -->
        <circle cx="115" cy="160" r="2" fill="#fff099" opacity=".75"/>
        <circle cx="145" cy="160" r="2" fill="#fff099" opacity=".75"/>
      </g>
    </svg>
  </div>

  <div class="tree-wrap">
    <svg class="tree-svg" viewBox="0 0 140 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="crownGrad" cx="50%" cy="40%">
          <stop offset="0%" stop-color="#9ad99a"/>
          <stop offset="60%" stop-color="#6dbf6b"/>
          <stop offset="100%" stop-color="#4a9a4a"/>
        </radialGradient>
        <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#7a4a2a"/>
          <stop offset="50%" stop-color="#9a6a4a"/>
          <stop offset="100%" stop-color="#5a3520"/>
        </linearGradient>
        <filter id="wc-tree" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="13"/>
          <feDisplacementMap in="SourceGraphic" scale="4"/>
          <feGaussianBlur stdDeviation="0.4"/>
        </filter>
      </defs>
      <g filter="url(#wc-tree)">
        <!-- trunk -->
        <path d="M 60 195 Q 58 160 62 120 Q 64 100 70 95 Q 76 100 78 120 Q 82 160 80 195 Z" fill="url(#trunkGrad)"/>
        <!-- crown (cluster of bumps, no flowers) -->
        <ellipse cx="70" cy="80" rx="56" ry="50" fill="url(#crownGrad)"/>
        <ellipse cx="38" cy="92" rx="28" ry="26" fill="url(#crownGrad)"/>
        <ellipse cx="100" cy="92" rx="28" ry="26" fill="url(#crownGrad)"/>
        <ellipse cx="70" cy="55" rx="36" ry="28" fill="url(#crownGrad)"/>
        <ellipse cx="70" cy="105" rx="42" ry="22" fill="url(#crownGrad)"/>
        <!-- subtle inner shadow on crown -->
        <ellipse cx="90" cy="100" rx="14" ry="10" fill="#4a9a4a" opacity=".35"/>
      </g>
    </svg>
  </div>

  <div class="bush-wrap" id="bush-wrap">
    <svg class="bush-svg" id="bush" viewBox="0 0 240 220" width="240" height="220">
      <defs>
        <radialGradient id="bushGrad" cx="50%" cy="38%">
          <stop offset="0%" stop-color="#b8e8b0"/>
          <stop offset="55%" stop-color="#6dbf6b"/>
          <stop offset="100%" stop-color="#4a9a4a"/>
        </radialGradient>
        <radialGradient id="leafHi" cx="50%" cy="50%">
          <stop offset="0%" stop-color="#d8f5cf" stop-opacity=".95"/>
          <stop offset="100%" stop-color="#6dbf6b" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="leafSh" cx="50%" cy="50%">
          <stop offset="0%" stop-color="#3d8a3d" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#4a9a4a" stop-opacity="0"/>
        </radialGradient>
        <filter id="watercolor" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="t"/>
          <feDisplacementMap in="SourceGraphic" in2="t" scale="7"/>
          <feGaussianBlur stdDeviation=".7"/>
        </filter>
        <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4"/>
        </filter>
      </defs>
      <ellipse cx="120" cy="212" rx="92" ry="9" fill="rgba(80,60,80,.22)" filter="url(#softShadow)"/>
      <g filter="url(#watercolor)">
        <ellipse cx="120" cy="125" rx="105" ry="92" fill="url(#bushGrad)"/>
        <circle cx="58" cy="105" r="56" fill="url(#bushGrad)"/>
        <circle cx="182" cy="105" r="56" fill="url(#bushGrad)"/>
        <circle cx="120" cy="60" r="58" fill="url(#bushGrad)"/>
        <circle cx="88" cy="80" r="46" fill="url(#bushGrad)"/>
        <circle cx="152" cy="80" r="46" fill="url(#bushGrad)"/>
        <circle cx="120" cy="115" r="52" fill="url(#bushGrad)"/>
      </g>
      <g opacity=".75">
        <ellipse cx="60" cy="68" rx="22" ry="13" fill="url(#leafHi)"/>
        <ellipse cx="180" cy="68" rx="22" ry="13" fill="url(#leafHi)"/>
        <ellipse cx="120" cy="35" rx="24" ry="14" fill="url(#leafHi)"/>
        <ellipse cx="38" cy="130" rx="18" ry="11" fill="url(#leafSh)"/>
        <ellipse cx="200" cy="130" rx="18" ry="11" fill="url(#leafSh)"/>
        <ellipse cx="120" cy="180" rx="20" ry="10" fill="url(#leafSh)"/>
      </g>
      <g id="flowers-layer"></g>
    </svg>
  </div>

  <div class="kittens-row" id="kittens-row"></div>

  <canvas id="confetti"></canvas>

  <div class="status">
    <p>🌸 Занятие <b id="s-count">0</b></p>
    <p>💨 Вдохов <b id="b-count">0</b></p>
  </div>

  <div class="title" id="title">Твой волшебный сад</div>

  <button class="icon-btn mute-btn" id="mute-btn" aria-label="Звук">🔊</button>
  <button class="icon-btn reset-btn" id="reset-btn">Сбросить прогресс</button>
</div>

<script>
"use strict";

/* ============================================================
   STATE
============================================================ */
const STORAGE_KEY = "magicGarden.v1";
const COATS = ["orange","calico","siamese","tuxedo","gray_tabby"];
const ACTIONS = ["wag","breathe","wash","lick","bounce","prowl","yawn","stretch"];

function defaultState(){
  return {
    bushLevel:0,
    totalFlowers:0,
    kittens:[],
    sessionScores:{},   // {1:50, 2:100}
    sessionKittens:{},  // {1:true, 2:true}
    muted:false
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    return Object.assign(defaultState(), JSON.parse(raw));
  }catch{ return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch{} }

let state = loadState();

/* ============================================================
   URL PARAMS
============================================================ */
const url = new URLSearchParams(window.location.search);
const score = Math.max(0, Math.min(100, parseInt(url.get("score")||"0",10)));
const breaths = Math.max(0, parseInt(url.get("breaths")||"0",10));
const session = Math.max(1, parseInt(url.get("session")||"1",10));
// ?reset=1 wipes saved progress (useful for tests / shared links)
if(url.get("reset") === "1"){
  try{ localStorage.removeItem(STORAGE_KEY); }catch{}
}

/* ============================================================
   MUTE
============================================================ */
const muteBtn = document.getElementById("mute-btn");
function syncMute(){ muteBtn.textContent = state.muted ? "🔇" : "🔊"; }
muteBtn.addEventListener("click",()=>{ state.muted = !state.muted; saveState(); syncMute(); });
syncMute();

/* ============================================================
   WEB AUDIO
============================================================ */
let audioCtx = null;
function getCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type="sine", vol=0.12, attack=0.02, release=0.25){
  if(state.muted) return;
  const ctx = getCtx(); if(!ctx) return;
  try{
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(vol, ctx.currentTime + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur + release);
    o.connect(g).connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + dur + release + 0.05);
  }catch{}
}
function jingle(){
  if(state.muted) return;
  const notes = [523.25, 659.25, 783.99, 1046.5];
  notes.forEach((n,i)=> setTimeout(()=>tone(n, 0.28, "sine", 0.1), i*110));
  setTimeout(()=>tone(1318.5, 0.4, "triangle", 0.07), 4*110);
}
function purr(){
  if(state.muted) return;
  const ctx = getCtx(); if(!ctx) return;
  try{
    const o = ctx.createOscillator();
    const lfo = ctx.createOscillator();
    const lfoG = ctx.createGain();
    const g = ctx.createGain();
    o.type = "sawtooth"; o.frequency.value = 78;
    lfo.type = "sine"; lfo.frequency.value = 22;
    lfoG.gain.value = 9;
    lfo.connect(lfoG).connect(o.frequency);
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 0.4);
    g.gain.linearRampToValueAtTime(0, ctx.currentTime + 2.6);
    o.connect(g).connect(ctx.destination);
    o.start(); lfo.start();
    o.stop(ctx.currentTime + 2.7); lfo.stop(ctx.currentTime + 2.7);
  }catch{}
}
function chime(){
  if(state.muted) return;
  const notes = [783.99, 1046.5, 1318.5];
  notes.forEach((n,i)=> setTimeout(()=>tone(n, 0.5, "triangle", 0.08), i*90));
}
function meow(){
  if(state.muted) return;
  const ctx = getCtx(); if(!ctx) return;
  try{
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(700, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.15);
    o.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.3);
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
    o.connect(g).connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.45);
  }catch{}
}

/* === Flower SVG === */
function makeFlower(cx,cy,kind){
  const NS = "http://www.w3.org/2000/svg";
  // outer g holds SVG-attribute translate; inner g takes CSS transform (for bloom animation)
  const outer = document.createElementNS(NS,"g");
  outer.setAttribute("transform",`translate(${cx},${cy})`);
  const inner = document.createElementNS(NS,"g");
  inner.setAttribute("class","flower");
  const palettes = {
    pink:   ["#ff8fa9","#ffb3c6","#ff8fa9","#ffb3c6","#ff8fa9"],
    yellow: ["#ffd966","#fff099","#ffd966","#fff099","#ffd966"],
    purple: ["#c89bff","#dfc1ff","#c89bff","#dfc1ff","#c89bff"],
    cream:  ["#fff5e1","#fffaf0","#fff5e1","#fffaf0","#fff5e1"]
  };
  const c = palettes[kind] || palettes.pink;
  for(let i=0;i<5;i++){
    const a = (i/5)*Math.PI*2 - Math.PI/2;
    const px = Math.cos(a)*7, py = Math.sin(a)*7;
    const e = document.createElementNS(NS,"ellipse");
    e.setAttribute("cx",px); e.setAttribute("cy",py);
    e.setAttribute("rx",5.5); e.setAttribute("ry",7.5);
    e.setAttribute("fill",c[i]); e.setAttribute("opacity",".95");
    inner.appendChild(e);
  }
  const ctr = document.createElementNS(NS,"circle");
  ctr.setAttribute("cx",0); ctr.setAttribute("cy",0); ctr.setAttribute("r",3.6);
  ctr.setAttribute("fill","#fff099");
  inner.appendChild(ctr);
  outer.appendChild(inner);
  return outer;
}

/* ============================================================
   KITTENS LAYOUT + ANIMATION
============================================================ */
const kittensRow = document.getElementById("kittens-row");
let kittenRefs = []; // {kitten, wrap, g}

function positionFor(index, total, screenW){
  // distribute across width with margin
  const margin = 8;
  const usable = 100 - margin*2;
  if(total === 1) return 50;
  const step = usable / (total - 1);
  return margin + step * index;
}

function renderAllKittens(){
  kittensRow.innerHTML = "";
  kittenRefs = [];
  state.kittens.forEach((k, i)=>{
    const adult = k.ageStage === "cat";
    const { wrap, svg, g } = makeKitten(k.coatColor, adult);
    const total = state.kittens.length;
    const leftPct = positionFor(i, total);
    wrap.style.left = leftPct + "%";
    wrap.style.transform = `translateX(-50%) translateY(40px) scale(.2)`;
    // idle animation
    const action = k.action || "wag";
    wrap.classList.add("anim-"+action);
    kittensRow.appendChild(wrap);
    kittenRefs.push({ kitten:k, wrap, g, action });

    // tap to change action
    wrap.addEventListener("click",()=>{
      const next = ACTIONS[(ACTIONS.indexOf(k.action||"wag")+1+Math.floor(Math.random()*3)) % ACTIONS.length];
      k.action = next;
      saveState();
      // reset classes
      ACTIONS.forEach(a=>wrap.classList.remove("anim-"+a));
      wrap.classList.add("anim-"+next);
      meow();
    });
  });
  // animate in (start in hidden state, then reveal immediately)
  kittenRefs.forEach((ref, i)=>{
    setTimeout(()=>{
      ref.wrap.classList.add("in");
      ref.wrap.style.transform = `translateX(-50%) translateY(0) scale(${ref.kitten.ageStage==="cat" ? 1 : 0.78})`;
    }, 80*i);
  });
}

function addNewKittenDom(kitten){
  const total = state.kittens.length;
  const { wrap, svg, g } = makeKitten(kitten.coatColor, false);
  const leftPct = positionFor(total-1, total);
  wrap.style.left = leftPct + "%";
  wrap.style.transform = `translateX(-50%) translateY(60px) scale(.2)`;
  const action = kitten.action || "wag";
  wrap.classList.add("anim-"+action);
  kittensRow.appendChild(wrap);
  kittenRefs.push({ kitten, wrap, g, action });
  wrap.addEventListener("click",()=>{
    const next = ACTIONS[(ACTIONS.indexOf(kitten.action||"wag")+1+Math.floor(Math.random()*3)) % ACTIONS.length];
    kitten.action = next;
    saveState();
    ACTIONS.forEach(a=>wrap.classList.remove("anim-"+a));
    wrap.classList.add("anim-"+next);
    meow();
  });
  // animate
  setTimeout(()=>{
    wrap.classList.add("in");
    wrap.style.transform = `translateX(-50%) translateY(0) scale(0.78)`;
  }, 100);
  // re-balance existing kittens' positions to match the new total
  repositionKittens();
  jingle();
}

// re-distribute kittens along the bottom row based on current count
function repositionKittens(){
  const total = state.kittens.length;
  state.kittens.forEach((k, i) => {
    if(kittenRefs[i] && kittenRefs[i].wrap){
      kittenRefs[i].wrap.style.left = positionFor(i, total) + "%";

  });

function growNewestKitten(){
  if(kittenRefs.length < 2) return;

  // = kittenRefs[kittenRefs.length - 2]
  const ref = kittenRefs[kittenRefs.length - 2];

   CONFETTI (canvas)
============================================================ */
const confettiCanvas = document.getElementById("confetti");
const confettiCtx = confettiCanvas.getContext("2d");
let confettiParts = [];
let confettiRun = false;
function resizeConfetti(){
  const dpr = window.devicePixelRatio || 1;
  confettiCanvas.width = window.innerWidth * dpr;
  confettiCanvas.height = window.innerHeight * dpr;
  confettiCanvas.style.width = window.innerWidth + "px";
  confettiCanvas.style.height = window.innerHeight + "px";
  confettiCtx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", resizeConfetti);
resizeConfetti();

function spawnConfetti(n=80){
  const colors = ["#ff8fa9","#ffd966","#c89bff","#fff5e1","#a8e0a0","#ffb3c6","#9ad7ff"];
  for(let i=0;i<n;i++){
    confettiParts.push({
      x: Math.random()*window.innerWidth,
      y: -20 - Math.random()*60,
      vx: (Math.random()-0.5)*2.2,
      vy: 1.5 + Math.random()*2.5,
      r: 3 + Math.random()*6,
      color: colors[(Math.random()*colors.length)|0],
      rot: Math.random()*Math.PI*2,
      vrot: (Math.random()-0.5)*0.25,
      life: 1,
      shape: Math.random()>0.5 ? "circle" : "star"
    });
  }
  if(!confettiRun){ confettiRun = true; requestAnimationFrame(stepConfetti); }
}
function stepConfetti(){
  confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  confettiParts = confettiParts.filter(p=>p.life>0 && p.y < window.innerHeight+40);
  confettiParts.forEach(p=>{
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.04;
    p.rot += p.vrot;
    p.life -= 0.0035;
    confettiCtx.save();
    confettiCtx.translate(p.x,p.y);
    confettiCtx.rotate(p.rot);
    confettiCtx.fillStyle = p.color;
    confettiCtx.globalAlpha = Math.max(0,p.life);
    if(p.shape==="circle"){
      confettiCtx.beginPath();
      confettiCtx.arc(0,0,p.r,0,Math.PI*2);
      confettiCtx.fill();
    } else {
      confettiCtx.beginPath();
      for(let i=0;i<5;i++){
        const a = (i/5)*Math.PI*2 - Math.PI/2;
        const x = Math.cos(a)*p.r, y = Math.sin(a)*p.r;
        i===0 ? confettiCtx.moveTo(x,y) : confettiCtx.lineTo(x,y);
      }
      confettiCtx.closePath();
      confettiCtx.fill();
    }
    confettiCtx.restore();
  });
  if(confettiParts.length){
    requestAnimationFrame(stepConfetti);
  } else {
    confettiRun = false;
  }
}

  s.textContent = ["✨","⭐","🌟","💫"][(Math.random()*4)|0];
  s.style.left = (5 + Math.random()*90) + "%";
  s.style.top  = (5 + Math.random()*70) + "%";
  s.style.fontSize = (14 + Math.random()*22) + "px";
  s.style.animationDelay = (Math.random()*1.5) + "s";
  document.getElementById("app").appendChild(s);
  setTimeout(()=>s.remove(), 5500);
}

/* ============================================================
   CELEBRATION TEXT
============================================================ */
function celebrate(text){
  const c = document.createElement("div");
  c.className = "celebrate";
  c.textContent = text;
  document.getElementById("app").appendChild(c);
  setTimeout(()=>c.remove(), 2900);
}

/* ============================================================
   STATUS
============================================================ */
function updateStatus(){
  document.getElementById("s-count").textContent = session;
  document.getElementById("b-count").textContent = breaths;
}

/* ============================================================
   REWARD FLOW
============================================================ */
// 0..49  → 0 flowers, no kitten
// 50..99 → 1 flower,  no kitten
// 100    → 2 flowers, +new kitten, previous kitten grows
function flowersForScore(s){
  if(s >= 100) return 2;
  if(s >= 50)  return 1;
  return 0;
}

function runReward(){
  // 1. bush growth (proportional to score)
  const growth = (score/100) * 0.45;
  state.bushLevel = Math.min(1, state.bushLevel + growth);

  // 2. flowers for this session (additive when score improves)
  const wantFlowers = flowersForScore(score);
  const hadFlowers  = flowersForScore(state.sessionScores[session] || 0);
  const addedFlowers = Math.max(0, wantFlowers - hadFlowers);
  state.totalFlowers = (state.totalFlowers || 0) + addedFlowers;
  state.sessionScores[session] = score;

  // 3. kitten — only at score=100 and when this session is new
  let addedKitten = false;
  if(score === 100 && !state.sessionKittens[session]){
    state.sessionKittens[session] = true;
    // age up the previously newest kitten
    if(state.kittens.length > 0){
      state.kittens[state.kittens.length - 1].ageStage = "cat";
    }
    const coat = COATS[(Math.random()*COATS.length)|0];
    const action = ACTIONS[(Math.random()*ACTIONS.length)|0];
    state.kittens.push({ id: Date.now()+Math.random(), ageStage:"kitten", coatColor: coat, action });
    addedKitten = true;
  }

  saveState();
  updateStatus();

  // Animate bush
  renderBush();

  // Flowers + purr (only if there are flowers to show)
  if(state.totalFlowers > 0){
    setTimeout(()=>{ placeFlowers(); purr(); }, 900);
  }
  // Confetti + celebration text
  if(score >= 100){
    setTimeout(()=>{ spawnConfetti(100); celebrate("✨ Отлично! ✨"); }, 400);
  } else if(score >= 50){
    setTimeout(()=>celebrate("🌸 Молодец!"), 400);
  } else {
    setTimeout(()=>celebrate("🌿 Хорошо!"), 400);
  }

  // Sparkles
  for(let i=0;i<6;i++) setTimeout(spawnSparkle, 700 + i*200);

  // Kitten add + grow
  if(addedKitten){
    setTimeout(()=> addNewKittenDom(state.kittens[state.kittens.length-1]), 1300);
  }
  if(score === 100 && state.kittens.length >= 2){
    setTimeout(growNewestKitten, 2000);
  }
}

/* ============================================================
   INIT
============================================================ */
function init(){
  // Show title
  setTimeout(()=>document.getElementById("title").classList.add("in"), 200);
  // Initial render — state BEFORE this exercise
  renderBush();
  renderAllKittens();
  updateStatus();
  // After 1s pause, run reward
  setTimeout(runReward, 1000);
}

/* ============================================================
   RESET
============================================================ */
document.getElementById("reset-btn").addEventListener("click",()=>{
  if(confirm("Сбросить весь прогресс сада? Все котята исчезнут 😿")){
    state = defaultState();
    saveState();
    location.reload();
  }
});

/* ============================================================
   AUDIO UNLOCK
============================================================ */
function unlockAudio(){
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
document.addEventListener("touchstart", unlockAudio, {once:true});
document.addEventListener("click", unlockAudio, {once:true});

/* ============================================================
   GO
============================================================ */
init();
</script>
