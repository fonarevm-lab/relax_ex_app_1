<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff8fa9">
<meta name="description" content="Награда за дыхательное упражнение: волшебный сад с цветами и котятами">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Волшебный сад</title>
<style>
  :root{
    --sky-1:#ffd6e0;
    --sky-2:#ffe9d6;
    --sky-3:#d6f0e8;
    --grass:#b8e0b3;
    --grass-d:#8fc88a;
    --bush:#6dbf6b;
    --bush-d:#4a9a4a;
    --bush-l:#a8e0a0;
    --pink:#ff8fa9;
    --yellow:#ffd966;
    --purple:#c89bff;
    --cream:#fff5e1;
    --text:#5a3d4f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Comic Sans MS",system-ui,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 45%,var(--sky-3) 100%);user-select:none;-webkit-user-select:none;}
  #app{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;}
  /* === Sun === */
  .sun{position:absolute;top:7%;right:8%;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff5b3 0%,#ffd966 55%,#ffb84d 100%);box-shadow:0 0 50px rgba(255,220,130,.65),0 0 80px rgba(255,200,120,.35);animation:sunPulse 4s ease-in-out infinite;z-index:1;}
  @keyframes sunPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  /* === Clouds === */
  .cloud{position:absolute;background:rgba(255,255,255,.85);border-radius:50%;filter:blur(1.8px);animation:drift linear infinite;z-index:1;box-shadow:inset 0 -4px 8px rgba(180,200,220,.25);}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%;}
  .cloud::before{width:80%;height:160%;top:-65%;left:8%;}
  .cloud::after{width:70%;height:140%;top:-50%;right:5%;}
  .cloud.c1{animation-duration:75s;}
  .cloud.c2{animation-duration:110s;opacity:.7;animation-delay:-40s;}
  .cloud.c3{animation-duration:90s;opacity:.6;animation-delay:-65s;}
  .cloud.c4{animation-duration:130s;opacity:.5;animation-delay:-20s;}
  @keyframes drift{from{transform:translateX(-260px);}to{transform:translateX(calc(100vw + 260px));}}
  /* === Sky overlays === */
  .sky-layer{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(255,220,230,.6) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(255,230,200,.5) 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(200,230,255,.35) 0%,transparent 60%);z-index:0;}
  /* === Background scenery (house on horizon + tree) === */
  .house-wrap{position:absolute;bottom:32%;left:50%;transform:translateX(-50%);width:78%;max-width:340px;z-index:3;filter:drop-shadow(0 6px 10px rgba(80,60,80,.16));opacity:.95;}
  .house-svg{display:block;width:100%;height:auto;}
  .chim-smoke{position:absolute;top:-6px;left:64%;width:14px;height:18px;pointer-events:none;z-index:4;}
  .chim-smoke circle{fill:rgba(255,255,255,.85);filter:blur(1.2px);animation:smokeRise 3.2s ease-in-out infinite;opacity:0;}
  .chim-smoke circle:nth-child(1){animation-delay:0s;}
  .chim-smoke circle:nth-child(2){animation-delay:1.05s;}
  .chim-smoke circle:nth-child(3){animation-delay:2.1s;}
  @keyframes smokeRise{
    0%  { transform:translate(0,4px) scale(.5); opacity:0; }
    15% { opacity:.85; }
    70% { opacity:.7; }
    100%{ transform:translate(-5px,-22px) scale(1.3); opacity:0; }
  }
  .tree-wrap{position:absolute;bottom:32%;right:2%;width:20%;max-width:90px;z-index:2;filter:drop-shadow(0 4px 6px rgba(80,60,80,.12));transform-origin:50% 100%;animation:treeSway 6s ease-in-out infinite;}
  .tree-svg{display:block;width:100%;height:auto;}
  @keyframes treeSway{0%,100%{transform:rotate(-1deg);}50%{transform:rotate(1.2deg);}}
  /* === Ground === */
  .ground{position:absolute;bottom:0;left:0;right:0;height:32%;background:linear-gradient(180deg,var(--grass) 0%,var(--grass-d) 100%);border-top-left-radius:50% 25%;border-top-right-radius:50% 25%;box-shadow:inset 0 4px 0 rgba(255,255,255,.2);z-index:2;}
  .ground::before{content:"";position:absolute;top:-6px;left:0;right:0;height:14px;background:radial-gradient(ellipse at 10% 50%,var(--grass) 0%,transparent 50%),radial-gradient(ellipse at 30% 50%,var(--grass-l) 0%,transparent 60%),radial-gradient(ellipse at 55% 50%,var(--grass) 0%,transparent 50%),radial-gradient(ellipse at 80% 50%,var(--grass-l) 0%,transparent 60%),radial-gradient(ellipse at 95% 50%,var(--grass) 0%,transparent 50%);background-size:60px 14px;background-repeat:repeat-x;}
  /* === Bushes (multiple, fixed size, off-center) === */
  .bushes-layer{position:absolute;inset:0;pointer-events:none;z-index:3;}
  .bush-wrap{position:absolute;bottom:18%;transform:translateX(-50%) scale(.6);transform-origin:bottom center;opacity:0;filter:drop-shadow(0 6px 10px rgba(80,60,80,.16));transition:transform 1.4s cubic-bezier(.34,1.56,.64,1),opacity .9s ease-out;z-index:3;}
  .bush-wrap.in{opacity:1;}
  .bush-wrap.size-S{transform:translateX(-50%) scale(.48);}
  .bush-wrap.size-M{transform:translateX(-50%) scale(.6);}
  .bush-wrap.size-L{transform:translateX(-50%) scale(.72);}
  .bush-wrap.behind{z-index:2;opacity:.7;filter:drop-shadow(0 4px 6px rgba(80,60,80,.12));}
  .bush-wrap.behind.in{opacity:.7;}
  .bush-svg{display:block;position:relative;}
  .bush-halo{position:absolute;left:50%;top:48%;width:120%;height:120%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:0;z-index:2;background:radial-gradient(circle,rgba(255,180,200,.6) 0%,rgba(255,220,150,.4) 30%,rgba(180,200,255,.3) 60%,transparent 75%);filter:blur(8px);transition:opacity .8s ease-out;}
  .bush-halo.on{opacity:1;animation:haloPulse 2.2s ease-in-out infinite;}
  @keyframes haloPulse{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.15);}}
  /* === Ground decor (rocks, mushrooms, grass) — children use position:absolute relative to #app === */
  .ground-decor{position:absolute;inset:0;z-index:2;pointer-events:none;}
  .rock{position:absolute;width:24px;height:14px;background:#a89c8e;border-radius:50% 50% 45% 45%;border:1.5px solid #6a605a;z-index:2;}
  .rock.big{width:38px;height:22px;background:#b8ad9e;border-width:2px;}
  .mushroom{position:absolute;width:20px;height:24px;z-index:2;}
  .mushroom .stem{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:5px;height:12px;background:linear-gradient(180deg,#fff5e1,#e8d8b8);border-radius:2px;}
  .mushroom .cap{position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:14px;background:linear-gradient(180deg,#ff8090,#d9455a);border-radius:50% 50% 45% 45%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);}
  .mushroom .cap::after{content:"";position:absolute;width:3px;height:3px;background:#fff5e1;border-radius:50%;top:4px;left:3px;box-shadow:8px 2px 0 #fff5e1,-2px 7px 0 #fff5e1,4px 9px 0 #fff5e1;}
  .grass-tuft{position:absolute;width:14px;height:16px;opacity:.85;z-index:2;}
  .grass-tuft::before,.grass-tuft::after{content:"";position:absolute;bottom:0;width:2.5px;background:linear-gradient(180deg,#7ec074,#3a8a3a);border-radius:2px 2px 0 0;transform-origin:bottom center;}
  .grass-tuft::before{left:2px;height:13px;transform:rotate(-14deg);}
  .grass-tuft::after{right:2px;height:15px;transform:rotate(10deg);}
  .grass-tuft::before{box-shadow:4px 2px 0 -0.5px #5fa858;}
  /* === Flowers === */
  .flower{opacity:0;transform:scale(0);transform-origin:center;transition:all .8s cubic-bezier(.34,1.56,.64,1);}
  .flower.bloom{opacity:1;transform:scale(1);}
  /* === Kittens === */
  .kittens-row{position:absolute;bottom:6%;left:0;right:0;width:100%;height:30%;z-index:6;pointer-events:none;}
  .kitten{position:absolute;bottom:0;opacity:0;cursor:pointer;pointer-events:auto;will-change:transform;z-index:6;}
  .kitten.in{opacity:1;}
  .kitten.grow{transition:transform 1.8s cubic-bezier(.34,1.56,.64,1);}
  .kitten:hover,.kitten:active{filter:drop-shadow(0 0 12px rgba(255,220,120,.7)) brightness(1.05);}
  .kitten .tail{transform-origin:30% 100%;}
  /* === Kitten facing: whole cat mirrors on the <svg>, with a slow periodic turn.
     --turn-delay (negative) staggers each cat so they don't flip in sync. === */
  .kitten > svg{
    transform-origin:50% 100%;
    transform-box:fill-box;
    animation:turnFromR 14s ease-in-out infinite;
    animation-delay:var(--turn-delay,0s);
    will-change:transform;
  }
  .kitten.facing-L > svg{ animation-name:turnFromL; }
  .kitten.grow > svg{ animation-play-state:paused; }
  @keyframes turnFromR{
    0%,38%  { transform:scaleX(1); }
    50%     { transform:scaleX(-1); }
    88%     { transform:scaleX(-1); }
    100%    { transform:scaleX(1); }
  }
  @keyframes turnFromL{
    0%,38%  { transform:scaleX(-1); }
    50%     { transform:scaleX(1); }
    88%     { transform:scaleX(1); }
    100%    { transform:scaleX(-1); }
  }
  /* === Speech bubble (tap a kitten) === */
  .speech{position:absolute;left:50%;bottom:88%;transform:translateX(-50%) translateY(8px) scale(.6);background:rgba(255,255,255,.96);border:2px solid #7a5a6a;border-radius:16px;padding:5px 11px;font-size:13px;font-weight:700;color:#5a3d4f;white-space:nowrap;box-shadow:0 3px 8px rgba(80,60,80,.2);pointer-events:none;opacity:0;animation:speechPop 1.7s cubic-bezier(.34,1.56,.64,1) forwards;z-index:25;letter-spacing:.2px;}
  .speech::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%) rotate(180deg);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid rgba(255,255,255,.96);}
  .speech::before{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%) rotate(180deg);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid #7a5a6a;}
  @keyframes speechPop{
    0%   { opacity:0; transform:translateX(-50%) translateY(14px) scale(.4); }
    14%  { opacity:1; transform:translateX(-50%) translateY(0)    scale(1.08); }
    24%  { opacity:1; transform:translateX(-50%) translateY(0)    scale(1); }
    78%  { opacity:1; transform:translateX(-50%) translateY(-2px) scale(1); }
    100% { opacity:0; transform:translateX(-50%) translateY(-14px) scale(.92); }
  }
  /* === Confetti canvas === */
  #confetti{position:absolute;inset:0;pointer-events:none;z-index:9;}
  /* === Mute button === */
  .icon-btn{position:absolute;border:none;background:rgba(255,255,255,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;z-index:20;box-shadow:0 4px 14px rgba(120,80,100,.18);transition:transform .15s,opacity .3s;}
  .icon-btn:active{transform:scale(.9);}
  .mute-btn{top:max(16px,env(safe-area-inset-top));right:16px;width:46px;height:46px;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center;}
  /* === Status panel === */
  .status{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;background:rgba(255,255,255,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px;padding:10px 14px;font-size:13px;z-index:15;box-shadow:0 4px 14px rgba(120,80,100,.12);line-height:1.5;}
  .status p{margin:0;display:flex;align-items:center;gap:6px;}
  .status b{color:var(--bush-d);font-weight:700;margin-left:auto;}
  /* === Reset button === */
  .reset-btn{bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:7px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:11.5px;color:var(--text);opacity:.5;letter-spacing:.2px;z-index:4;}
  .reset-btn:hover,.reset-btn:active{opacity:.95;}
  /* === Title === */
  .title{position:absolute;top:max(80px,calc(env(safe-area-inset-top) + 70px));left:50%;transform:translateX(-50%);font-size:18px;font-weight:700;color:var(--text);text-shadow:0 1px 0 rgba(255,255,255,.6);z-index:12;text-align:center;letter-spacing:.3px;opacity:0;transition:opacity .8s;}
  .title.in{opacity:1;}
  /* === Sparkles === */
  .sparkle{position:absolute;pointer-events:none;animation:sparkle 2.2s ease-in-out infinite;z-index:8;}
  @keyframes sparkle{0%,100%{opacity:0;transform:scale(.4) rotate(0);}50%{opacity:1;transform:scale(1) rotate(180deg);}}
  /* === Celebration text === */
  .celebrate{position:absolute;top:28%;left:50%;font-size:22px;font-weight:700;color:var(--text);text-shadow:0 2px 8px rgba(255,255,255,.85);z-index:12;pointer-events:none;text-align:center;white-space:nowrap;opacity:0;animation:pop 2.8s ease-out forwards;}
  @keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(20px) scale(.5);}15%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.15);}75%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}100%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(1);}}
  /* === Idle kitten animations === */
  @keyframes wag{0%,100%{transform:rotate(0);}50%{transform:rotate(-6deg);}}
  @keyframes breathe{0%,100%{transform:scaleY(1);}50%{transform:scaleY(.94);}}
  @keyframes wash{0%,100%{transform:rotate(0);}25%{transform:rotate(-10deg) translateX(-3px);}75%{transform:rotate(10deg) translateX(3px);}}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-18px);}}
  @keyframes prowl{0%,100%{transform:translateX(0);}50%{transform:translateX(24px);}}
  @keyframes yawn{0%,80%,100%{transform:scaleY(1);}88%{transform:scaleY(.9);}}
  @keyframes stretch{0%,100%{transform:scaleY(.92) scaleX(1.05);}50%{transform:scaleY(1.08) scaleX(.96);}}
  @keyframes lick{0%,100%{transform:rotate(0) translateY(0);}30%{transform:rotate(-7deg) translateX(-2px) translateY(-2px);}60%{transform:rotate(-3deg) translateX(-1px) translateY(-3px);}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1);}96%{transform:scaleY(.1);}}
  .anim-wag g{animation:wag 2s ease-in-out infinite;transform-origin:50% 100%;}
  .anim-breathe g{animation:breathe 3s ease-in-out infinite;transform-origin:50% 100%;}
  .anim-wash g{animation:wash 2.4s ease-in-out infinite;transform-origin:50% 100%;}
  .anim-bounce g{animation:bounce 1.4s ease-in-out infinite;}
  .anim-prowl g{animation:prowl 4.5s ease-in-out infinite;}
  .anim-yawn g{animation:yawn 4s ease-in-out infinite;transform-origin:50% 100%;}
  .anim-stretch g{animation:stretch 3.5s ease-in-out infinite;transform-origin:50% 100%;}
  .anim-lick g{animation:lick 2.8s ease-in-out infinite;transform-origin:50% 100%;}
  .eye{transform-origin:center;animation:blink 5s ease-in-out infinite;}
  .eye.r{animation-delay:.15s;}
  /* === Magic particles === */
  .magic-puff{position:fixed;border-radius:50%;pointer-events:none;z-index:11;box-shadow:0 0 8px currentColor;}
  .magic-star{position:fixed;pointer-events:none;z-index:11;color:#ffd966;filter:drop-shadow(0 0 4px rgba(255,220,100,.7));}
  @keyframes magicPuff{
    0%  { transform:translate(0,0) scale(1); opacity:1; }
    70% { opacity:.9; }
    100%{ transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0; }
  }
  @keyframes magicFloat{
    0%  { transform:translateY(0) rotate(0); opacity:.9; }
    100%{ transform:translateY(-30px) rotate(180deg); opacity:0; }
  }
  /* === Rainbow halo on bush — handled by per-bush .bush-halo (defined earlier) === */
  /* === Falling star === */
  @keyframes fallingStar{
    0%  { transform:translate(0,-30vh) scale(.5) rotate(0); opacity:0; }
    15% { opacity:1; }
    80% { opacity:1; }
    100%{ transform:translate(var(--tx),100vh) scale(1) rotate(720deg); opacity:0; }
  }
  .falling-star{position:fixed;top:0;left:0;font-size:42px;pointer-events:none;z-index:11;filter:drop-shadow(0 0 12px rgba(255,220,120,.9));}
  /* === Butterfly visitor (score=100) — flies across with a wavy path === */
  .butterfly{position:absolute;pointer-events:none;z-index:10;filter:drop-shadow(0 2px 4px rgba(80,60,80,.25));will-change:transform;transform-origin:center;}
  .butterfly .wings{transform-origin:30px 25px;animation:butterflyFlap .22s ease-in-out infinite alternate;}
  .butterfly[data-ltr="0"] svg{transform:scaleX(-1);}
  @keyframes butterflyFlap{
    0%  { transform:scaleX(.4) scaleY(1.05); }
    100%{ transform:scaleX(1.05) scaleY(.95); }
  }
  @keyframes butterflyFly{
    0%   { transform:translate(0,0) scale(1); opacity:0; }
    8%   { opacity:1; }
    25%  { transform:translate(calc(var(--dx) * .25), -22px) scale(1); }
    50%  { transform:translate(calc(var(--dx) * .5), 18px) scale(1); }
    75%  { transform:translate(calc(var(--dx) * .75), -14px) scale(1); }
    92%  { opacity:1; }
    100% { transform:translate(var(--dx), 0) scale(1); opacity:0; }
  }
  /* === Glow around kittens === */
  .glow{position:absolute;left:50%;bottom:-10px;width:130%;height:60%;transform:translateX(-50%);border-radius:50%;pointer-events:none;opacity:0;z-index:-1;background:radial-gradient(ellipse at center,rgba(255,220,150,.7) 0%,rgba(255,180,200,.3) 40%,transparent 70%);filter:blur(6px);transition:opacity .6s;}
  .glow.on{opacity:1;animation:glowPulse 1.6s ease-in-out infinite;}
  @keyframes glowPulse{0%,100%{opacity:.7;transform:translateX(-50%) scale(1);}50%{opacity:1;transform:translateX(-50%) scale(1.15);}}
  /* === Multi-line celebration text === */
  .celebrate-line{position:absolute;left:50%;font-weight:700;color:var(--text);text-shadow:0 2px 8px rgba(255,255,255,.85);z-index:12;pointer-events:none;text-align:center;white-space:nowrap;opacity:0;animation:pop 3s ease-out forwards;}
  .celebrate-line.main{font-size:30px;top:24%;}
  .celebrate-line.sub {font-size:18px;top:32%;color:#c87a8a;animation-delay:.4s;}
</style>
</head>
<body>
<div id="app">
  <div class="sky-layer"></div>
  <div class="sun"></div>
  <div class="cloud c1" style="top:14%;width:140px;height:44px;animation-delay:0s;"></div>
  <div class="cloud c2" style="top:9%;width:100px;height:34px;animation-delay:-45s;"></div>
  <div class="cloud c3" style="top:22%;width:80px;height:28px;animation-delay:-80s;"></div>
  <div class="ground"></div>

  <div class="house-wrap">
    <svg class="house-svg" viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="logGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e8c599"/>
          <stop offset="100%" stop-color="#c89968"/>
        </linearGradient>
        <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#c97050"/>
          <stop offset="100%" stop-color="#8a4530"/>
        </linearGradient>
        <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a4a6a"/>
          <stop offset="100%" stop-color="#1a2a4a"/>
        </linearGradient>
        <radialGradient id="windowGlow" cx="50%" cy="60%">
          <stop offset="0%" stop-color="#fff5b3" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#fff5b3" stop-opacity="0"/>
        </radialGradient>
        <filter id="wc-bg" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="9"/>
          <feDisplacementMap in="SourceGraphic" scale="3"/>
          <feGaussianBlur stdDeviation="0.4"/>
        </filter>
      </defs>
      <g filter="url(#wc-bg)">
        <!-- soft ground shadow under house -->
        <ellipse cx="130" cy="210" rx="120" ry="4" fill="rgba(80,60,80,.22)"/>

        <!-- roof (pitched) -->
        <polygon points="20,108 130,40 240,108" fill="url(#roofGrad)"/>
        <line x1="20" y1="108" x2="240" y2="108" stroke="#6a3520" stroke-width="2.5" opacity=".55"/>
        <!-- roof shingle hints -->
        <path d="M 40 102 L 70 80 M 60 110 L 100 80 M 100 108 L 140 78 M 140 110 L 180 80 M 180 108 L 220 84" stroke="#7a3a25" stroke-width="1" fill="none" opacity=".4"/>

        <!-- walls (log cabin) -->
        <rect x="30" y="105" width="200" height="100" fill="url(#logGrad)"/>
        <!-- horizontal log lines -->
        <g stroke="#8a5a3a" stroke-width="1.2" opacity=".5">
          <line x1="30" y1="120" x2="230" y2="120"/>
          <line x1="30" y1="135" x2="230" y2="135"/>
          <line x1="30" y1="150" x2="230" y2="150"/>
          <line x1="30" y1="165" x2="230" y2="165"/>
          <line x1="30" y1="180" x2="230" y2="180"/>
          <line x1="30" y1="195" x2="230" y2="195"/>
        </g>
        <!-- log end caps on left/right walls -->

<script>
"use strict";

/* ============================================================
   STATE
============================================================ */
const STORAGE_KEY = "magicGarden.v2";
const COATS = ["orange","calico","siamese","tuxedo","gray_tabby"];
const ACTIONS = ["wag","breathe","wash","lick","bounce","prowl","yawn","stretch"];

/* Phrases a kitten can say when tapped (toddler-friendly Russian) */
const KITTEN_SAY = [
  "Мяу! 🐾",
  "Мурр~ 💕",
  "Поиграем? ✨",
  "Мурлык! 😺",
  "Люблю тебя! 💖",
  "*мурчит*",
  "Я тут! 🌸",
  "Погладь меня 🥰",
  "Хочу рыбку 🐟",
  "Чмок! 💋"
];

/* === Bush grid (fixed nests; never stack on top of the house) ===
   Each bush has {id, x(%), size, behind, flowers[], maxFlowers}.
   - "behind" = small bush sitting on the horizon, behind the house (depth).
   - Flowers are placed on the bush at predefined spots, no overlap. */
const BUSH_NESTS = [
  // Front-row nests (main bush, visible, never under the house center 40-60%)
  { id:"b1",  x:18, size:"M", behind:false, maxFlowers:6 },
  { id:"b2",  x:82, size:"M", behind:false, maxFlowers:6 },
  { id:"b3",  x:8,  size:"S", behind:false, maxFlowers:4 },
  { id:"b4",  x:92, size:"S", behind:false, maxFlowers:4 },
  { id:"b5",  x:33, size:"S", behind:false, maxFlowers:4 },
  { id:"b6",  x:67, size:"S", behind:false, maxFlowers:4 },
  // Background row (small, between/before house, lower z, less opacity)
  { id:"bh1", x:42, size:"S", behind:true,  maxFlowers:3 },
  { id:"bh2", x:58, size:"S", behind:true,  maxFlowers:3 },
];

/* Spots inside one bush (in SVG units, viewBox 240x220) for flower placement */
const SPOTS_BY_SIZE = {
  S: [ // up to 4
    {x:120,y:60,k:"pink"},
    {x:84, y:80,k:"yellow"},
    {x:156,y:80,k:"purple"},
    {x:120,y:108,k:"cream"},
  ],
  M: [ // up to 6
    {x:120,y:48,k:"pink"},
    {x:72, y:72,k:"yellow"},
    {x:170,y:72,k:"purple"},
    {x:96, y:38,k:"cream"},
    {x:148,y:42,k:"pink"},
    {x:120,y:95,k:"yellow"},
  ],
  L: [ // up to 8
    {x:120,y:42,k:"pink"},
    {x:72, y:66,k:"yellow"},
    {x:170,y:66,k:"purple"},
    {x:96, y:36,k:"cream"},
    {x:148,y:40,k:"pink"},
    {x:50, y:100,k:"yellow"},
    {x:192,y:100,k:"pink"},
    {x:120,y:90,k:"purple"},
  ],
};

function defaultState(){
  return {
    bushes:[
      {id:"b1", size:"M", flowers:[]},     // one starter bush (empty) — first flower will bloom on score>=50
    ],
    totalFlowers:0,
    totalSessions:0,    // count of perfect sessions (score=100) — drives flower growth
    kittens:[],
    sessionScores:{},   // {1:50, 2:100}
    sessionKittens:{},  // {1:true, 2:true}
    sessionFlowers:{},  // {1:1, 2:2}  per-session flower count
    muted:false
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const merged = Object.assign(defaultState(), JSON.parse(raw));
      // Migration: for existing kittens without facing, set by id hash (so it's
      // a mix of R/L, not all the same direction)
      if(merged.kittens && merged.kittens.length){
        merged.kittens.forEach((k, i)=>{
          if(!k.facing){
            // hash the id to get a stable value
            let h = typeof k.id === "number" ? k.id : 0;
            if(typeof k.id === "string") for(let c=0;c<k.id.length;c++) h = (h*31 + k.id.charCodeAt(c)) | 0;
            k.facing = ((Math.abs(h) ^ i) % 2 === 0) ? "R" : "L";
          }
        });
      }
      return merged;
    }
    // Migration from v1 (had bushLevel + totalFlowers) — only if v1 exists.
    const old = localStorage.getItem("magicGarden.v1");
    if(old){
      try{
        const v1 = JSON.parse(old);
        const migrated = defaultState();
        const total = Math.max(0, Math.min(40, v1.totalFlowers||0));
        // Distribute old flowers into first 1-2 bushes (never above capacity)
        const targets = ["b1","b2"];
        let placed = 0;
        for(let i=0;i<targets.length && placed<total;i++){
          const nest = BUSH_NESTS.find(n=>n.id===targets[i]);
          const cap = nest.maxFlowers;
          const take = Math.min(cap, total - placed);
          for(let k=0;k<take;k++){
            const spot = SPOTS_BY_SIZE[nest.size][k % SPOTS_BY_SIZE[nest.size].length];
            migrated.bushes.push({id:targets[i], size:nest.size, flowers:[{kind:spot.k, x:spot.x, y:spot.y}]});
            placed++;
          }
        }
        migrated.totalFlowers = total;
        if(v1.sessionScores) migrated.sessionScores = v1.sessionScores;
        if(v1.sessionKittens) migrated.sessionKittens = v1.sessionKittens;
        if(v1.kittens) migrated.kittens = v1.kittens;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
        localStorage.removeItem("magicGarden.v1");
        return migrated;
      }catch{ return defaultState(); }
    }
    return defaultState();
  }catch{ return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch{} }

let state = loadState();

/* ============================================================
   URL PARAMS
============================================================ */
const url = new URLSearchParams(window.location.search);
const score = Math.max(0, Math.min(100, parseInt(url.get("score")||"0",10)));
const breaths = Math.max(0, parseInt(url.get("breaths")||"0",10));

// ?reset=1 wipes saved progress (useful for tests / shared links)
if(url.get("reset") === "1"){
  try{ localStorage.removeItem(STORAGE_KEY); }catch{}
}

/* ============================================================
   MUTE
============================================================ */
const muteBtn = document.getElementById("mute-btn");
function syncMute(){ muteBtn.textContent = state.muted ? "🔇" : "🔊"; }
muteBtn.addEventListener("click",()=>{ state.muted = !state.muted; saveState(); syncMute(); });
syncMute();

/* ============================================================
   WEB AUDIO
============================================================ */
let audioCtx = null;
function getCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type="sine", vol=0.12, attack=0.02, release=0.25){
  if(state.muted) return;
  const ctx = getCtx(); if(!ctx) return;
  try{
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(vol, ctx.currentTime + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur + release);
    o.connect(g).connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + dur + release + 0.05);
  }catch{}
}
function jingle(){
  if(state.muted) return;
  const notes = [523.25, 659.25, 783.99, 1046.5];
  notes.forEach((n,i)=> setTimeout(()=>tone(n, 0.28, "sine", 0.1), i*110));
  setTimeout(()=>tone(1318.5, 0.4, "triangle", 0.07), 4*110);
}
function purr(){
  if(state.muted) return;
  const ctx = getCtx(); if(!ctx) return;
  try{
    const o = ctx.createOscillator();
    const lfo = ctx.createOscillator();
    const lfoG = ctx.createGain();
    const g = ctx.createGain();
    o.type = "sawtooth"; o.frequency.value = 78;
    lfo.type = "sine"; lfo.frequency.value = 22;
    lfoG.gain.value = 9;
    lfo.connect(lfoG).connect(o.frequency);
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 0.4);
    g.gain.linearRampToValueAtTime(0, ctx.currentTime + 2.6);
    o.connect(g).connect(ctx.destination);
    o.start(); lfo.start();
    o.stop(ctx.currentTime + 2.7); lfo.stop(ctx.currentTime + 2.7);
  }catch{}
}
function chime(){
  if(state.muted) return;
  const notes = [783.99, 1046.5, 1318.5];
  notes.forEach((n,i)=> setTimeout(()=>tone(n, 0.5, "triangle", 0.08), i*90));
}
function meow(){
  if(state.muted) return;
  const ctx = getCtx(); if(!ctx) return;
  try{
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(700, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.15);
    o.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.3);
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
    o.connect(g).connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.45);
  }catch{}
}

/* ============================================================
   BUSH RENDER — multiple bushes, fixed size, off-center
============================================================ */
const bushesLayer = document.getElementById("bushes-layer");

/* === Bush body SVG builder (no flowers; flowers added separately) === */
function bushBodySVG(size, nestId){
  // viewBox fixed at 240x220 — all bushes use it, scaling is done via CSS .size-*
  return `
    <ellipse cx="120" cy="212" rx="92" ry="9" fill="rgba(80,60,80,.22)" filter="url(#softShadow)"/>
    <g filter="url(#watercolor)">
      <ellipse cx="120" cy="125" rx="105" ry="92" fill="url(#bushGrad)"/>
      <circle cx="58" cy="105" r="56" fill="url(#bushGrad)"/>
      <circle cx="182" cy="105" r="56" fill="url(#bushGrad)"/>
      <circle cx="120" cy="60" r="58" fill="url(#bushGrad)"/>
      <circle cx="88" cy="80" r="46" fill="url(#bushGrad)"/>
      <circle cx="152" cy="80" r="46" fill="url(#bushGrad)"/>
      <circle cx="120" cy="115" r="52" fill="url(#bushGrad)"/>
    </g>
    <g opacity=".75">
      <ellipse cx="60" cy="68" rx="22" ry="13" fill="url(#leafHi)"/>
      <ellipse cx="180" cy="68" rx="22" ry="13" fill="url(#leafHi)"/>
      <ellipse cx="120" cy="35" rx="24" ry="14" fill="url(#leafHi)"/>
      <ellipse cx="38" cy="130" rx="18" ry="11" fill="url(#leafSh)"/>
      <ellipse cx="200" cy="130" rx="18" ry="11" fill="url(#leafSh)"/>
      <ellipse cx="120" cy="180" rx="20" ry="10" fill="url(#leafSh)"/>
    </g>
    <g class="bush-flowers" data-bush="${nestId}"></g>
  `;
}

/* === Flower SVG (5-petal, with growth scale) === */
function makeFlower(cx,cy,kind,size=1){
  const NS = "http://www.w3.org/2000/svg";
  const outer = document.createElementNS(NS,"g");
  outer.setAttribute("transform",`translate(${cx},${cy}) scale(${size})`);
  const inner = document.createElementNS(NS,"g");
  inner.setAttribute("class","flower");
  const palettes = {
    pink:   ["#ff8fa9","#ffb3c6","#ff8fa9","#ffb3c6","#ff8fa9"],
    yellow: ["#ffd966","#fff099","#ffd966","#fff099","#ffd966"],
    purple: ["#c89bff","#dfc1ff","#c89bff","#dfc1ff","#c89bff"],
    cream:  ["#fff5e1","#fffaf0","#fff5e1","#fffaf0","#fff5e1"]
  };
  const c = palettes[kind] || palettes.pink;
  for(let i=0;i<5;i++){
    const a = (i/5)*Math.PI*2 - Math.PI/2;
    const px = Math.cos(a)*7, py = Math.sin(a)*7;
    const e = document.createElementNS(NS,"ellipse");
    e.setAttribute("cx",px); e.setAttribute("cy",py);
    e.setAttribute("rx",5.5); e.setAttribute("ry",7.5);
    e.setAttribute("fill",c[i]); e.setAttribute("opacity",".95");
    inner.appendChild(e);
  }
  const ctr = document.createElementNS(NS,"circle");
  ctr.setAttribute("cx",0); ctr.setAttribute("cy",0); ctr.setAttribute("r",3.6);
  ctr.setAttribute("fill","#fff099");
  inner.appendChild(ctr);
  outer.appendChild(inner);
  return outer;
}

/* === Create one bush DOM (used by both initial render and new-bush spawn) === */
function spawnBushDom(bush, isNew){
  const nest = BUSH_NESTS.find(n=>n.id===bush.id) || BUSH_NESTS[0];
  const wrap = document.createElement("div");
  wrap.className = "bush-wrap size-" + bush.size + (nest.behind ? " behind" : "");
  wrap.dataset.bushId = bush.id;
  wrap.style.left = nest.x + "%";
  const halo = document.createElement("div");
  halo.className = "bush-halo";
  wrap.appendChild(halo);
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.classList.add("bush-svg");
  svg.setAttribute("viewBox","0 0 240 220");
  svg.setAttribute("width","240");
  svg.setAttribute("height","220");
  svg.innerHTML = bushBodySVG(bush.size, bush.id);
  wrap.appendChild(svg);
  bushesLayer.appendChild(wrap);
  // Pre-existing flowers (already bloomed) — render with no animation delay
  const flowerLayer = svg.querySelector(".bush-flowers");
  // Flowers grow with sessions: each session adds 0.05 to scale, capped at +0.4
  const flowerScale = 1 + Math.min(0.4, (state.totalSessions||0) * 0.05);
  bush.flowers.forEach(f => {
    const flowerG = makeFlower(f.x, f.y, f.kind, flowerScale);
    flowerLayer.appendChild(flowerG);
    const inner = flowerG.querySelector(".flower");
    if(inner) inner.classList.add("bloom");   // immediate
  });
  // Animate in
  if(isNew){
    // Slight delay staggered by position so multiple bushes don't all pop at once
    setTimeout(()=>wrap.classList.add("in"), 80);
  } else {
    wrap.classList.add("in");
  }
  return { wrap, svg, halo, flowerLayer };
}

/* === Full re-render of all bushes (called on init) === */
function renderBushes(){
  // remove anything except the shared <defs> svg
  Array.from(bushesLayer.children).forEach(c => { if(!c.querySelector("defs")) c.remove(); });
  state.bushes.forEach(b => spawnBushDom(b, false));
}

/* === Add a new bush (when current ones are full) — picks first free nest === */
function addNewBushInFreeNest(){
  // pick first nest that isn't in state.bushes (prefer front row, then behind row)
  const frontOrder = BUSH_NESTS.filter(n=>!n.behind);
  const backOrder  = BUSH_NESTS.filter(n=>n.behind);
  const candidates = [...frontOrder, ...backOrder];
  const used = new Set(state.bushes.map(b=>b.id));
  const free = candidates.find(n => !used.has(n.id));
  if(!free) return null;
  const bush = { id: free.id, size: free.size, flowers: [] };
  state.bushes.push(bush);
  return spawnBushDom(bush, true);
}

/* === Add a flower to a specific bush (if room) === */
function addFlowerToBush(bushIdx, kind){
  const bush = state.bushes[bushIdx];
  const nest = BUSH_NESTS.find(n=>n.id===bush.id) || BUSH_NESTS[0];
  const spots = SPOTS_BY_SIZE[bush.size] || SPOTS_BY_SIZE.M;
  if(bush.flowers.length >= nest.maxFlowers) return null; // full
  // Pick a random unused spot
  const used = new Set(bush.flowers.map(f => `${f.x},${f.y}`));
  const candidates = spots.filter(s => !used.has(`${s.x},${s.y}`));
  if(!candidates.length) return null;
  const spot = candidates[(Math.random()*candidates.length)|0];
  const flower = { kind, x: spot.x, y: spot.y };
  bush.flowers.push(flower);
  // Find the DOM and animate the new flower
  const wrap = bushesLayer.querySelector(`.bush-wrap[data-bush-id="${bush.id}"]`);
  if(wrap){
    const flowerLayer = wrap.querySelector(".bush-flowers");
    const f = makeFlower(spot.x, spot.y, kind);
    flowerLayer.appendChild(f);
    const inner = f.querySelector(".flower");
    if(inner) inner.classList.add("bloom");
    // Magic puff
    requestAnimationFrame(()=>{
      const rect = f.getBoundingClientRect();
      if(rect.width){
        spawnMagicPuff(rect.left + rect.width/2, rect.top + rect.height/2,
          { count: 10, size: 6, distance: 40, colors: PUFF_COLORS_BLOOM });
      }
    });
    return { wrap, flower, spot };
  }
  return null;
}

/* === Find a bush that has room for a new flower, or create one === */
function placeFlowerInGarden(kind){
  // First pass: any existing bush with room
  for(let i=0;i<state.bushes.length;i++){
    const bush = state.bushes[i];
    const nest = BUSH_NESTS.find(n=>n.id===bush.id);
    if(bush.flowers.length < nest.maxFlowers){
      return addFlowerToBush(i, kind);
    }
  }
  // No room anywhere — create a new bush and put the flower there
  const newBush = addNewBushInFreeNest();
  if(!newBush) return null;
  const idx = state.bushes.length - 1;
  return addFlowerToBush(idx, kind);
}

/* ============================================================
   KITTENS LAYOUT + ANIMATION
============================================================ */
const kittensRow = document.getElementById("kittens-row");
let kittenRefs = []; // {kitten, wrap, g}

/* Per-cat visual variety (size + vertical offset) so they don't look like copy-paste.
   Deterministic based on id, so it persists across reloads. */
function getCatVariations(id){
  // Hash id (number or string) to a stable value
  let h = 0;
  if(typeof id === "number") h = id;
  else if(id) for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) | 0;
  h = Math.abs(h);
  return {
    sizeVar: 0.90 + ((h % 19) / 100),     // 0.90..1.08 — visible variety, no tiny cats
    yOffset: ((h % 7) - 3) * 12,          // -36..+24 px (vertical variety)
  };
}

function positionFor(index, total, screenW){
  // distribute across width with margin
  // Wider margin when there are fewer cats, so they don't get clipped at the edges.
  // 1 cat → 50% center.  2 cats → 18/82 (cats may have tail overflow).  3 cats → 14/50/86.  4+ cats → 8% margin tight.
  let margin;
  if(total <= 1)      margin = 0;
  else if(total === 2) margin = 18;
  else if(total === 3) margin = 14;
  else                 margin = 8;
  const usable = 100 - margin*2;
  if(total === 1) return 50;
  const step = usable / (total - 1);
  return margin + step * index;
}

function renderAllKittens(){
  kittensRow.innerHTML = "";
  kittenRefs = [];
  state.kittens.forEach((k, i)=>{
    const adult = k.ageStage === "cat";
    // Random fallback if no facing stored
    const facing = k.facing || (Math.random() < 0.5 ? "L" : "R");
    k.facing = facing;
    const { wrap, svg, g } = makeKitten(k.coatColor, adult, facing);
    const total = state.kittens.length;
    const leftPct = positionFor(i, total);
    // Use stored variations if set; otherwise compute from id (deterministic)
    if(typeof k._sizeVar !== "number" || typeof k._yOffset !== "number"){
      const v = getCatVariations(k.id);
      k._sizeVar = v.sizeVar; k._yOffset = v.yOffset;
    }
    if(false) console.log("renderAllKittens APP="+JSON.stringify(document.getElementById("app").getBoundingClientRect()));
    const v = { sizeVar: k._sizeVar, yOffset: k._yOffset };
    wrap.style.left = leftPct + "%";
    wrap.style.transform = `translateX(-50%) translateY(${40 + v.yOffset}px) scale(${0.2 * v.sizeVar})`;
    // Stagger the turn animation so kittens don't flip in sync.
    // Negative delay = start "in the middle" of the keyframe timeline.
    // Range: -14s..0s. We use the same hash as sizeVar/yOffset for stability
    // across reloads (same cat always turns at the same beat).
    const tHash = Math.abs((typeof k.id === "number" ? k.id : 0) ^ (k.id ? k.id.length*7 : 0));
    const turnDelay = -(tHash % 14) + "s";
    wrap.style.setProperty("--turn-delay", turnDelay);
    // idle animation
    const action = k.action || "wag";
    wrap.classList.add("anim-"+action);
    kittensRow.appendChild(wrap);
    kittenRefs.push({ kitten:k, wrap, g, action });

    // tap to change action + show speech bubble
    wrap.addEventListener("click",()=>{
      const next = ACTIONS[(ACTIONS.indexOf(k.action||"wag")+1+Math.floor(Math.random()*3)) % ACTIONS.length];
      k.action = next;
      saveState();
      // reset classes
      ACTIONS.forEach(a=>wrap.classList.remove("anim-"+a));
      wrap.classList.add("anim-"+next);
      meow();
      sayKitten(wrap);
    });
  });
  // animate in (start in hidden state, then reveal immediately)
  kittenRefs.forEach((ref, i)=>{
    setTimeout(()=>{
      ref.wrap.classList.add("in");
      const v = ref.kitten._sizeVar || 1;
      const y = ref.kitten._yOffset || 0;
      ref.wrap.style.transform = `translateX(-50%) translateY(${y}px) scale(${(ref.kitten.ageStage==="cat" ? 1 : 0.78) * v})`;
    }, 80*i);
  });
}

function addNewKittenDom(kitten){
  const total = state.kittens.length;
  // Random facing (50/50) — already set by runReward with random choice.
  let facing;
  if(kitten.facing){
    facing = kitten.facing;
  } else {
    facing = Math.random() < 0.5 ? "L" : "R";
  }
  kitten.facing = facing;
  // Per-cat visual variety
  const v = getCatVariations(kitten.id);
  kitten._sizeVar = v.sizeVar; kitten._yOffset = v.yOffset;
  const { wrap, svg, g } = makeKitten(kitten.coatColor, false, facing);
  const leftPct = positionFor(total-1, total);
  wrap.style.left = leftPct + "%";
  wrap.style.transform = `translateX(-50%) translateY(${60 + v.yOffset}px) scale(${0.2 * v.sizeVar})`;
  // Stagger turn animation (see renderAllKittens for rationale).
  const tHash = Math.abs((typeof kitten.id === "number" ? kitten.id : 0) ^ (kitten.id ? String(kitten.id).length*7 : 0));
  wrap.style.setProperty("--turn-delay", -(tHash % 14) + "s");
  const action = kitten.action || "wag";
  wrap.classList.add("anim-"+action);
  kittensRow.appendChild(wrap);
  kittenRefs.push({ kitten, wrap, g, action });
  wrap.addEventListener("click",()=>{
    const next = ACTIONS[(ACTIONS.indexOf(kitten.action||"wag")+1+Math.floor(Math.random()*3)) % ACTIONS.length];
    kitten.action = next;
    saveState();
    ACTIONS.forEach(a=>wrap.classList.remove("anim-"+a));
    wrap.classList.add("anim-"+next);
    meow();
    sayKitten(wrap);
  });
  // Falling star before arrival
  spawnFallingStar();
  // Magic puff where the kitten will land
  setTimeout(()=>{
    const r = wrap.getBoundingClientRect();
    const cx = r.left + r.width/2;
    const cy = window.innerHeight - 30; // near bottom
    spawnMagicPuff(cx, cy, { count: 14, size: 7, distance: 70, colors: PUFF_COLORS_KITTEN, emojis:["✨","⭐","💫"] });
  }, 100);
  // animate
  setTimeout(()=>{
    wrap.classList.add("in");
    wrap.style.transform = `translateX(-50%) translateY(${v.yOffset}px) scale(${0.78 * v.sizeVar})`;
    showKittenGlow(wrap, 2200);
  }, 100);
  // re-balance existing kittens' positions to match the new total
  repositionKittens();
  jingle();
}

// re-distribute kittens along the bottom row based on current count
function repositionKittens(){
  const total = state.kittens.length;
  state.kittens.forEach((k, i) => {
    if(kittenRefs[i] && kittenRefs[i].wrap){
      kittenRefs[i].wrap.style.left = positionFor(i, total) + "%";
    }
  });
}

function growNewestKitten(){
  if(kittenRefs.length < 2) return;
  const ref = kittenRefs[kittenRefs.length - 2];
  ref.kitten.ageStage = "cat";
  ref.wrap.classList.add("adult","grow");
  const v = ref.kitten._sizeVar || 1;
  const y = ref.kitten._yOffset || 0;
  ref.wrap.style.transform = `translateX(-50%) translateY(${y}px) scale(${1 * v})`;
  setTimeout(()=>ref.wrap.classList.remove("grow"), 1800);
  // Glow + big magic burst at kitten position
  const r = ref.wrap.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top  + r.height/2;
  spawnMagicPuff(cx, cy, { count: 18, size: 8, distance: 90, colors: PUFF_COLORS_GROW, emojis:["✨","⭐","🌟","💫"] });
  showKittenGlow(ref.wrap, 2600);
}

/* ============================================================
   CONFETTI (canvas)
============================================================ */
const confettiCanvas = document.getElementById("confetti");
const confettiCtx = confettiCanvas.getContext("2d");
let confettiParts = [];
let confettiRun = false;
function resizeConfetti(){
  const dpr = window.devicePixelRatio || 1;
  confettiCanvas.width = window.innerWidth * dpr;
  confettiCanvas.height = window.innerHeight * dpr;
  confettiCanvas.style.width = window.innerWidth + "px";
  confettiCanvas.style.height = window.innerHeight + "px";
  confettiCtx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", resizeConfetti);
resizeConfetti();

function spawnConfetti(n=80){
  const colors = ["#ff8fa9","#ffd966","#c89bff","#fff5e1","#a8e0a0","#ffb3c6","#9ad7ff"];
  for(let i=0;i<n;i++){
    confettiParts.push({
      x: Math.random()*window.innerWidth,
      y: -20 - Math.random()*60,
      vx: (Math.random()-0.5)*2.2,
      vy: 1.5 + Math.random()*2.5,
      r: 3 + Math.random()*6,
      color: colors[(Math.random()*colors.length)|0],
      rot: Math.random()*Math.PI*2,
      vrot: (Math.random()-0.5)*0.25,
      life: 1,
      shape: Math.random()>0.5 ? "circle" : "star"
    });
  }
  if(!confettiRun){ confettiRun = true; requestAnimationFrame(stepConfetti); }
}
function stepConfetti(){
  confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  confettiParts = confettiParts.filter(p=>p.life>0 && p.y < window.innerHeight+40);
  confettiParts.forEach(p=>{
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.04;
    p.rot += p.vrot;
    p.life -= 0.0035;
    confettiCtx.save();
    confettiCtx.translate(p.x,p.y);
    confettiCtx.rotate(p.rot);
    confettiCtx.fillStyle = p.color;
    confettiCtx.globalAlpha = Math.max(0,p.life);
    if(p.shape==="circle"){
      confettiCtx.beginPath();
      confettiCtx.arc(0,0,p.r,0,Math.PI*2);
      confettiCtx.fill();
    } else {
      confettiCtx.beginPath();
      for(let i=0;i<5;i++){
        const a = (i/5)*Math.PI*2 - Math.PI/2;
        const x = Math.cos(a)*p.r, y = Math.sin(a)*p.r;
        i===0 ? confettiCtx.moveTo(x,y) : confettiCtx.lineTo(x,y);
      }
      confettiCtx.closePath();
      confettiCtx.fill();
    }
    confettiCtx.restore();
  });
  if(confettiParts.length){
    requestAnimationFrame(stepConfetti);
  } else {
    confettiRun = false;
  }
}

/* ============================================================
   SPARKLES
============================================================ */
const PUFF_COLORS_BLOOM  = ["#ff8fa9","#ffd966","#c89bff","#fff5e1","#a8e0a0","#ffb3c6"];
const PUFF_COLORS_GROW   = ["#ffd966","#fff099","#ff8fa9","#c89bff","#a8e0a0"];
const PUFF_COLORS_KITTEN = ["#fff5e1","#ffd966","#ffb3c6","#a8e0a0","#9ad7ff"];

function spawnMagicPuff(x, y, opts={}){
  const count   = opts.count   ?? 10;
  const size    = opts.size    ?? 6;
  const dist    = opts.distance ?? 50;
  const colors  = opts.colors  ?? PUFF_COLORS_BLOOM;
  const dur     = opts.duration ?? 1100;
  const emojis  = opts.emojis  ?? null;
  for(let i=0; i<count; i++){
    const angle = (i/count) * Math.PI * 2 + Math.random()*0.4;
    const dx = Math.cos(angle) * (dist * (0.7 + Math.random()*0.6));
    const dy = Math.sin(angle) * (dist * (0.7 + Math.random()*0.6));
    const p = document.createElement("div");
    if(emojis && Math.random() < 0.5){
      p.className = "magic-star";
      p.textContent = emojis[(Math.random()*emojis.length)|0];
      p.style.fontSize = (12 + Math.random()*10) + "px";
    } else {
      p.className = "magic-puff";
      const c = colors[(Math.random()*colors.length)|0];
      p.style.background = c;
      p.style.color = c;
      p.style.width  = (size * (0.6 + Math.random()*0.8)) + "px";
      p.style.height = p.style.width;
    }
    p.style.left = x + "px";
    p.style.top  = y + "px";
    p.style.setProperty("--dx", dx + "px");
    p.style.setProperty("--dy", dy + "px");
    p.style.animation = `magicPuff ${dur}ms cubic-bezier(.2,.7,.4,1) forwards`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), dur + 100);
  }
}

function spawnFallingStar(){
  const fs = document.createElement("div");
  fs.className = "falling-star";
  fs.textContent = ["⭐","🌟","✨"][(Math.random()*3)|0];
  const startX = (10 + Math.random()*80) + "vw";
  const tx = (Math.random()*40 - 20) + "vw";

  fs.style.setProperty("--tx", tx);

}

function spawnSparkle(){
  const s = document.createElement("div");

function pulseBushHalos(){

/* === Butterfly visitor — flies across the screen on score=100 ===
   Random color, 4-5s wavy flight from one side to the other. */
const BUTTERFLY_COLORS = [
  {wing:"#ff8fa9", body:"#5a3d4f", accent:"#fff5e1"},  // pink
  {wing:"#ffd966", body:"#7a5a2a", accent:"#fff5b3"},  // yellow
  {wing:"#c89bff", body:"#5a3d7a", accent:"#f0e1ff"},  // purple
  {wing:"#9ad7ff", body:"#3a5a7a", accent:"#e1f0ff"}   // blue
];
function spawnButterfly(){
  const colors = BUTTERFLY_COLORS[(Math.random()*BUTTERFLY_COLORS.length)|0];
  const leftToRight = Math.random() < 0.5;
  const NS = "http://www.w3.org/2000/svg";
  // Build butterfly SVG (wings flapping via CSS animation)
  const wrap = document.createElement("div");
  wrap.className = "butterfly";
  wrap.style.left = leftToRight ? "-60px" : "calc(100% + 10px)";
  // Random vertical band — middle of the screen, so it crosses the house area
  const yBand = 35 + Math.random() * 25;   // 35..60% from top
  wrap.style.top = yBand + "%";
  wrap.dataset.ltr = leftToRight ? "1" : "0";
  // SVG
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 60 50");
  svg.setAttribute("width", "60");
  svg.setAttribute("height", "50");
  svg.style.overflow = "visible";
  svg.innerHTML = `
    <g class="bw">
      <ellipse cx="30" cy="25" rx="2" ry="9" fill="${colors.body}"/>
      <circle cx="30" cy="16" r="2.2" fill="${colors.body}"/>
      <line x1="30" y1="14" x2="27" y2="9" stroke="${colors.body}" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="30" y1="14" x2="33" y2="9" stroke="${colors.body}" stroke-width="0.8" stroke-linecap="round"/>
      <g class="wings">
        <ellipse cx="18" cy="20" rx="13" ry="10" fill="${colors.wing}" opacity="0.85" transform="rotate(-15 18 20)"/>
        <ellipse cx="42" cy="20" rx="13" ry="10" fill="${colors.wing}" opacity="0.85" transform="rotate(15 42 20)"/>
        <ellipse cx="20" cy="32" rx="10" ry="7" fill="${colors.wing}" opacity="0.75" transform="rotate(20 20 32)"/>
        <ellipse cx="40" cy="32" rx="10" ry="7" fill="${colors.wing}" opacity="0.75" transform="rotate(-20 40 32)"/>
        <circle cx="18" cy="20" r="2.5" fill="${colors.accent}"/>
        <circle cx="42" cy="20" r="2.5" fill="${colors.accent}"/>
      </g>
    </g>
  `;
  wrap.appendChild(svg);
  // Animation: fly across (left-to-right or right-to-left), wavy path
  const dx = leftToRight ? "calc(100vw + 100px)" : "calc(-100vw - 100px)";
  wrap.style.setProperty("--dx", dx);
  wrap.style.setProperty("--scale", leftToRight ? "1" : "-1");
  // Random duration 3.8..5.2s for variety
  const dur = 3.8 + Math.random() * 1.4;
  wrap.style.animation = `butterflyFly ${dur}s cubic-bezier(.4,.0,.6,1) forwards`;
  document.getElementById("app").appendChild(wrap);
  setTimeout(()=>wrap.remove(), dur * 1000 + 200);
}

/* ============================================================
   CELEBRATION TEXT — multi-line, fading
============================================================ */
const PRAISES = {
  100: [
    { main:"✨ Отлично! ✨",          sub:"Сад расцветает!" },
    { main:"🌸 Браво! 🌸",            sub:"Ты волшебница!" },
    { main:"⭐ Умница! ⭐",            sub:"Котёнок подрастает!" },
    { main:"💫 Молодец! 💫",          sub:"Каждый день — чудо!" },
    { main:"🌟 Супер! 🌟",            sub:"Садик стал ещё краше!" }
  ],
  "100full": [
    { main:"🦋 Сад полон чудес! 🦋", sub:"Бабочка прилетела!" },
    { main:"🌈 Волшебный сад! 🌈",   sub:"Два котёнка — счастье!" },
    { main:"🌟 Чудесно! 🌟",         sub:"Бабочка в гости!" }
  ],
  50: [
    { main:"🌱 Хорошо!",              sub:"Ещё чуть-чуть!" },
    { main:"🌼 Молодец!",             sub:"Цветок распустился!" }
  ],
  0: [
    { main:"🌿 Готово!",              sub:"Завтра будет ещё лучше" }
  ]
};
function celebrate(gardenFull=false){
  let tier;
  if(score >= 100 && gardenFull) tier = "100full";
  else if(score >= 100) tier = 100;
  else if(score >= 50)  tier = 50;
  else tier = 0;
  const list = PRAISES[tier] || PRAISES[0];
  const pick = list[(Math.random()*list.length)|0];
  const main = document.createElement("div");
  main.className = "celebrate-line main";
  main.textContent = pick.main;
  document.getElementById("app").appendChild(main);
  setTimeout(()=>main.remove(), 3100);
  if(pick.sub){
    const sub = document.createElement("div");
    sub.className = "celebrate-line sub";
    sub.textContent = pick.sub;
    document.getElementById("app").appendChild(sub);
    setTimeout(()=>sub.remove(), 3500);
  }
}

function updateStatus(){

/* ============================================================
   REWARD FLOW
============================================================ */
// 0..49  → 0 flowers, no kitten
// 50..99 → 1 flower,  no kitten
// 100    → 2 flowers, +new kitten, previous kitten grows
function flowersForScore(s){
  if(s >= 100) return 2;
  if(s >= 50)  return 1;
  return 0;
}

function runReward(){
  // 1. flowers for this session (additive when score improves)
  const wantFlowers = flowersForScore(score);
  const hadFlowers  = flowersForScore(state.sessionScores[session] || 0);
  const addedFlowers = Math.max(0, wantFlowers - hadFlowers);
  state.sessionScores[session] = score;
  state.sessionFlowers[session] = wantFlowers;

  // 2. kitten — only at score=100 and when this session is new
  let addedKitten = false;
  let gardenFull = false;
  if(score === 100 && !state.sessionKittens[session]){
    state.sessionKittens[session] = true;
    // Cap at 2 kittens — beyond that, garden is "full" and gets a butterfly visitor instead.
    const KITTEN_CAP = 2;
    if(state.kittens.length >= KITTEN_CAP){
      // Garden is full — no new kitten, but mark as full so the celebration differs.
      gardenFull = true;
    } else {
      // age up the previously newest kitten
      if(state.kittens.length > 0){
        state.kittens[state.kittens.length - 1].ageStage = "cat";
      }
      const coat = COATS[(Math.random()*COATS.length)|0];
      const action = ACTIONS[(Math.random()*ACTIONS.length)|0];
      // Random facing (50/50) so two cats can both face the same way, opposite, etc.
      // Slight bias: if there's a previous cat, lean 60% toward opposite direction so
      // most pairs end up facing each other (but not always — keeps it interesting).
      const lastFacing = state.kittens.length ? state.kittens[state.kittens.length-1].facing : null;
      const opp = lastFacing ? (lastFacing === "R" ? "L" : "R") : "R";
      const facing = Math.random() < 0.6 ? opp : (Math.random() < 0.5 ? "L" : "R");
      state.kittens.push({ id: Date.now()+Math.random(), ageStage:"kitten", coatColor: coat, action, facing });
      addedKitten = true;
    }
  }

  saveState();
  updateStatus();

  // 3. animate flowers blooming on bushes (one at a time, with magic)
  if(addedFlowers > 0){
    const kinds = ["pink","yellow","purple","cream"];
    let flowerTimers = [];
    for(let i=0;i<addedFlowers;i++){
      const k = kinds[(Math.random()*kinds.length)|0];
      flowerTimers.push(setTimeout(()=>{
        if(i===0) chime();
        const r = placeFlowerInGarden(k);
        if(r) purr();
      }, 700 + i*650));
    }
    // Update totalFlowers AFTER spawning
    state.totalFlowers = state.bushes.reduce((s,b)=>s+b.flowers.length, 0);
    saveState();
  }

  // 4. Rainbow halo on front-row bushes at score=100
  if(score >= 100){
    setTimeout(()=>{ pulseBushHalos(); }, 300);
  } else {
    clearBushHalos();
  }

  // 5. Confetti + celebration text
  if(score >= 100){
    setTimeout(()=>{ spawnConfetti(120); celebrate(gardenFull); }, 400);
  } else if(score >= 50){
    setTimeout(()=>celebrate(), 400);
  } else {
    setTimeout(()=>celebrate(), 400);
  }

  // 6. Sparkles
  for(let i=0;i<6;i++) setTimeout(spawnSparkle, 700 + i*200);

  // 6b. Butterfly bonus — flies across the screen on every score=100
  if(score === 100){
    setTimeout(()=>{ spawnButterfly(); }, 900);
  }

  // 7. Kitten add + grow with magic
  if(addedKitten){
    setTimeout(()=>{
      addNewKittenDom(state.kittens[state.kittens.length-1]);
    }, 1300);
  }
  if(score === 100 && state.kittens.length >= 2 && !gardenFull){
    setTimeout(growNewestKitten, 2000);
  }
}

/* ============================================================
   GROUND DECOR (rocks, mushrooms, grass tufts)
============================================================ */
function renderGroundDecor(){
  try{
  const layer = document.getElementById("ground-decor");
  if(!layer) return;
  // Add: 2 big rocks, 3 small rocks, 2 mushrooms, 4 grass tufts
  // No seed-based randomness — stable + simple. Positions are in % of viewport.
  const decor = [
    {cls:"rock big", left:4,  bottom:14},
    {cls:"rock big", left:91, bottom:18},
    {cls:"rock",     left:32, bottom:6},
    {cls:"rock",     left:58, bottom:9},
    {cls:"rock",     left:78, bottom:5},
    {cls:"mushroom", left:24, bottom:12},
    {cls:"mushroom", left:71, bottom:10},
    {cls:"grass-tuft",left:14, bottom:9},
    {cls:"grass-tuft",left:46, bottom:11},
    {cls:"grass-tuft",left:64, bottom:7},
    {cls:"grass-tuft",left:87, bottom:13},
  ];
  decor.forEach(d => {
    const el = document.createElement("div");
    el.className = d.cls;
    el.style.left = d.left + "%";
    el.style.bottom = d.bottom + "%";
    // Append to #app (not layer) — #app is position:relative, so the rocks get
    // a real positioned ancestor and render reliably in headless Edge.
    const app = document.getElementById("app");
    (app || layer).appendChild(el);
  });
  }catch(e){ console.error("renderGroundDecor error:", e); }
}

/* ============================================================
   INIT
============================================================ */
function init(){
  // Show title
  setTimeout(()=>document.getElementById("title").classList.add("in"), 200);
  // Decor (static, deterministic)
  renderGroundDecor();
  // Initial render — state BEFORE this exercise
  renderBushes();
  renderAllKittens();
  updateStatus();
  // After 1s pause, run reward
  setTimeout(runReward, 1000);
}
